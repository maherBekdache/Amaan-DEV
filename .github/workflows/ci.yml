name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export -p web --output-dir /tmp/web
      - run: npx expo export -p android --output-dir /tmp/android

  whatsapp-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-bridge/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amaan:ci .
      - run: docker build -t amaan-whatsapp-bridge:ci whatsapp-bridge

  # Builds and runs the real link sandbox (D19): URL.vet with Chrome behind the egress proxy,
  # the expansion worker and the egress proxy, first with runc, then with gVisor.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install -e "backend[dev]"
      - name: Sandbox unit and end-to-end tests (no Docker)
        run: python -m pytest -q sandbox/tests
      - name: Build and start URL.vet, Amaan and the sandbox
        run: ./scripts/amaan.sh up
      - name: Check the running sandbox (runc)
        run: python sandbox/ci_check.py
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          # The worker creates its Unix socket inside gVisor; Amaan connects to it from outside.
          sudo runsc install -- --host-uds=create
          cat /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Restart everything under gVisor
        run: |
          echo "AMAAN_SANDBOX_RUNTIME=runsc" >> .env
          ./scripts/amaan.sh up
          docker inspect -f '{{.Name}} {{.HostConfig.Runtime}}' $(docker ps -q)
      - name: Check the running sandbox (gVisor)
        run: python sandbox/ci_check.py --runtime runsc
      - name: Logs
        if: always()
        run: |
          docker compose logs --tail 80 amaan expander egress || true
          docker compose -p urlvet logs --tail 80 || true
