# Added on top of docker-compose.yml by start-everything.bat / 'up -Phone'.
# Opens port 8001 on this computer's Wi-Fi/LAN address so the phone app can
# reach the link checker. Only /gateway/* answers there, and only with the
# pairing token (shown as a QR code in Amaan: WhatsApp tab -> Connect phone).
services:
  amaan:
    ports:
      - "0.0.0.0:8001:8000"
    environment:
      AMAAN_PHONE_URL: ${AMAAN_PHONE_URL:-}
      AMAAN_PHONE_TOKEN: ${AMAAN_PHONE_TOKEN:-}
