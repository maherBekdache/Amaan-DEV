[project]
name = "amaan"
version = "0.1.0"
description = "Amaan scam-detection prototype - local analysis backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pillow>=10.3",
    "opencv-contrib-python-headless>=4.9",
    "pyzbar>=0.1.9",
    "tldextract>=5.1",
    "idna>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "qrcode[pil]>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amaan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
