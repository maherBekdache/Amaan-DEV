# Amaan stack. Start everything with:  .\scripts\amaan.ps1 up   (Windows)
#                                      ./scripts/amaan.sh up    (WSL / Linux / macOS)
# The script starts URL.vet (its own, unmodified compose project) first and
# then this file. `docker compose up` alone also works; links are then
# checked with Amaan's local rules only until URL.vet is running.
name: amaan

services:
  amaan:
    build: .
    image: amaan:dev
    ports:
      - "127.0.0.1:8000:8000"   # loopback only: not reachable from the network
    environment:
      AMAAN_URLVET_BASE_URL: http://urlvet-backend:8080
      # Extra Host-header names to accept (comma-separated); empty = localhost only.
      AMAAN_ALLOWED_HOSTS: ${AMAAN_ALLOWED_HOSTS:-}
      # WhatsApp bridge (only used when it runs); the token is generated into .env by the scripts.
      AMAAN_WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:8090
      AMAAN_BRIDGE_TOKEN: ${AMAAN_BRIDGE_TOKEN:-}
      # Multi-source link check: put your free keys in .env (see .env.example).
      AMAAN_SAFE_BROWSING_KEY: ${AMAAN_SAFE_BROWSING_KEY:-}
      AMAAN_VIRUSTOTAL_KEY: ${AMAAN_VIRUSTOTAL_KEY:-}
      AMAAN_URLSCAN_KEY: ${AMAAN_URLSCAN_KEY:-}
      AMAAN_URLHAUS_KEY: ${AMAAN_URLHAUS_KEY:-}
      AMAAN_FEEDS_ENABLED: ${AMAAN_FEEDS_ENABLED:-1}
      # AI second opinion: Ollama installed on this computer (see README).
      AMAAN_AI_PROVIDER: ${AMAAN_AI_PROVIDER:-ollama}
      AMAAN_AI_URL: ${AMAAN_AI_URL:-http://host.docker.internal:11434}
      AMAAN_AI_MODEL: ${AMAAN_AI_MODEL:-qwen2.5:3b}
      AMAAN_AI_API_KEY: ${AMAAN_AI_API_KEY:-}
      AMAAN_AI_REMOTE_MAY_READ_MESSAGES: ${AMAAN_AI_REMOTE_MAY_READ_MESSAGES:-0}
      # Voice notes: local speech-to-text server (empty = off)
      AMAAN_STT_URL: ${AMAAN_STT_URL:-}
      AMAAN_STT_MODEL: ${AMAAN_STT_MODEL:-}
      # Expansion worker (sandbox layer L5): answers over a Unix socket in the shared volume.
      AMAAN_EXPANDER_SOCKET: /run/amaan-expander/expander.sock
    volumes:
      - expander_sock:/run/amaan-expander   # the only channel to the worker; it cannot call us
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, urlvet]
    read_only: true              # nothing is written inside the container
    tmpfs: [/tmp]                # large uploads may spool here; deleted after analysis
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Optional WhatsApp bridge (Milestone 3). Only started with the "whatsapp"
  # profile: start-whatsapp.bat, or  docker compose --profile whatsapp up -d
  # Not published on any host port; only the amaan service talks to it.
  whatsapp-bridge:
    profiles: [whatsapp]
    build: ./whatsapp-bridge
    image: amaan-whatsapp-bridge:dev
    environment:
      AMAAN_BACKEND_URL: http://amaan:8000
      AMAAN_BRIDGE_TOKEN: ${AMAAN_BRIDGE_TOKEN:-}
    volumes:
      - wa_session:/data   # WhatsApp login session + chat selection only, never messages
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # --- Sandbox for untrusted links (docs/LINK_SECURITY.md, docs/DECISIONS.md D19) -----------
  # The expansion worker follows a link hop by hop without a browser. It sits on an
  # internal network whose only way out is the egress proxy (ports 80/443 to public
  # internet addresses only), and it answers Amaan through a Unix socket, so it can reach
  # neither this computer's network nor the Amaan API.
  # Stronger isolation: AMAAN_SANDBOX_RUNTIME=runsc in .env after installing gVisor.
  expander:
    build: ./sandbox/expander
    image: amaan-expander:dev
    environment:
      # A fixed address, not the name "egress": under gVisor the container cannot use Docker's DNS.
      AMAAN_EGRESS_PROXY: http://10.213.47.2:3128
      AMAAN_EXPANDER_SOCKET: /run/amaan-expander/expander.sock
    volumes:
      - expander_sock:/run/amaan-expander
    networks: [sandbox]
    runtime: ${AMAAN_SANDBOX_RUNTIME:-runc}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped

  egress:
    build: ./sandbox/egress
    image: amaan-egress:dev
    networks:
      sandbox: {ipv4_address: 10.213.47.2}
      egress: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped

volumes:
  wa_session:
  expander_sock:

networks:
  sandbox:
    internal: true   # no route out except through the egress proxy
    ipam:
      config: [{subnet: 10.213.47.0/24}]
  egress: {}
  urlvet:
    # Shared with URL.vet's backend (see infra/urlvet/docker-compose.amaan.yml).
    # Created by the scripts; create once by hand with:
    #   docker network create amaan-urlvet
    name: amaan-urlvet
    external: true
